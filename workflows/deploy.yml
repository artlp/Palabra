name: Deploy Palabra to GitHub Pages
run-name: Pages deployment - run ${{ github.run_id }}, attempt ${{ github.run_attempt }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run tests and syntax checks
        run: npm test && npm run check

      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest sw.js .nojekyll _site/
          cp -R js data icons _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Show artifact name
        run: echo "Deploying artifact $PAGES_ARTIFACT_NAME"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
          include-hidden-files: true
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
